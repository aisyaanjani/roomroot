<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" preserveAspectRatio="xMidYMid meet" overflow="hidden" role="img" aria-labelledby="title desc">
  <title id="title">A sunlit, welcoming living room</title>
  <desc id="desc">A calm editorial illustration of a leafy living room with a broad window, comfortable green sofa, oak table, plant, and warm wood details.</desc>
  <defs>
