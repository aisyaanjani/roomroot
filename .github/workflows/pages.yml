name: Publish RoomRoot demo (manual)
on:
  workflow_dispatch:
    inputs:
      confirm_api_free_static_release:
        description: 'Confirm this release disables application API calls and publishes static GitHub Pages assets only?'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: roomroot-pages
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.confirm_api_free_static_release && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: website
      - run: npm run lint && npm run test:matching && npm run build -- --mode release
        working-directory: website
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - uses: actions/deploy-pages@v4
        id: deployment
